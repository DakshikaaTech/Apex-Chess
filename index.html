<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Chess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 p-4 text-center">
        <h1 class="text-2xl font-bold tracking-wider text-amber-400">GRANDMASTER PREP STUDIO</h1>
        <p class="text-sm text-slate-400">Deep Engine Analysis & Repertoire Builder</p>
    </header>
    
    <main class="flex-grow container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-6xl">
        <div class="lg:col-span-2 flex flex-col items-center justify-center bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700">
            <div id="board" style="width:450px" class="mb-4"></div>
            <div class="flex space-x-4">
                <button id="startBtn" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 rounded font-semibold transition">Reset Board</button>
                <button id="clearBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded font-semibold transition">Clear Board</button>
            </div>
        </div>
        
        <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-amber-300 border-b border-slate-700 pb-2 mb-3">GM Diagnostics</h2>
                <div class="mb-4">
                    <span class="text-xs text-slate-400 uppercase tracking-wide">Stockfish Evaluation</span>
                    <div id="evalDisplay" class="text-xl font-mono font-bold text-emerald-400 mt-1">Loading...</div>
                </div>
                <div class="mb-4">
                    <span class="text-xs text-slate-400 uppercase tracking-wide">Notation History</span>
                    <div id="moveHistory" class="h-48 bg-slate-900 border border-slate-700 rounded p-3 overflow-y-auto font-mono text-sm text-slate-300 mt-1"></div>
                </div>
            </div>
            <div>
                <label class="text-xs text-slate-400 uppercase tracking-wide">Board FEN</label>
                <input type="text" id="fenInput" readonly class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs font-mono text-slate-300 mt-1">
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    
    <script>
        var board = null;
        var game = new Chess();
        var $moveHistory = $('#moveHistory');
        var $fenInput = $('#fenInput');
        var stockfish = null;

        $(document).ready(function() {
            // 1. Initialize Chessboard
            var config = {
                draggable: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            };
            board = Chessboard('board', config);
            updateStatus();

            // 2. Initialize Stockfish Worker via Blob (Bypasses CORS restrictions)
            fetch('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')
                .then(response => response.text())
                .then(scriptContent => {
                    var blob = new Blob([scriptContent], { type: 'application/javascript' });
                    var workerUrl = URL.createObjectURL(blob);
                    
                    stockfish = new Worker(workerUrl);
                    stockfish.postMessage('uci');

                    stockfish.onmessage = function(event) {
                        var line = event.data;
                        if (line.startsWith('info') && line.includes('score')) {
                            var matchCp = line.match(/score cp (-?\d+)/);
                            var matchMate = line.match(/score mate (-?\d+)/);

                            if (matchCp) {
                                var cp = parseInt(matchCp[1]);
                                var evalScore = (game.turn() === 'b' ? -cp : cp) / 100;
                                var formatted = (evalScore > 0 ? '+' : '') + evalScore.toFixed(2);
                                $('#evalDisplay').text(formatted);

                                if (evalScore > 0) {
                                    $('#evalDisplay').removeClass('text-rose-400 text-amber-400').addClass('text-emerald-400');
                                } else if (evalScore < 0) {
                                    $('#evalDisplay').removeClass('text-emerald-400 text-amber-400').addClass('text-rose-400');
                                }
                            } else if (matchMate) {
                                $('#evalDisplay').text('M' + matchMate[1]).removeClass('text-emerald-400 text-rose-400').addClass('text-amber-400');
                            }
                        }
                    };
                    analyzePosition();
                })
                .catch(err => {
                    console.error("Failed to load Stockfish engine:", err);
                    $('#evalDisplay').text("Offline");
                });
        });

        function analyzePosition() {
            if (!stockfish) return;
            stockfish.postMessage('stop');
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 12');
        }

        function updateStatus() {
            $fenInput.val(game.fen());

            var history = game.history({verbose: true});
            var htmlContent = '';
            for (var i = 0; i < history.length; i += 2) {
                var moveNum = (i / 2) + 1;
                var whiteMove = history[i].san;
                var blackMove = history[i+1] ? history[i+1].san : '';
                
                htmlContent += `<div class="py-0.5"><span class="text-slate-500">${moveNum}.</span> <span class="text-white">${whiteMove}</span> <span class="text-slate-400">${blackMove}</span></div>`;
            }
            $moveHistory.html(htmlContent);
            $moveHistory.scrollTop($moveHistory[0].scrollHeight);
            analyzePosition();
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });
            if (move === null) return 'snapback';
            updateStatus();
        }

        function onSnapEnd() {
            board.position(game.fen());
        }

        $('#startBtn').on('click', function(){
            game.reset();
            board.start();
            updateStatus();
        });

        $('#clearBtn').on('click', function(){
            game.clear();
            board.clear();
            updateStatus();
            $('#evalDisplay').text('+0.00');
        });
    </script>
</body>
</html>
